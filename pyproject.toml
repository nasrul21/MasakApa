[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
files = ["app.py", "config", "errors.py", "models", "providers", "state.py", "ui"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
